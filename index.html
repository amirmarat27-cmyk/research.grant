<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Грантовая система исследовательских проектов</title><meta name="color-scheme" content="light">
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--ink:#1b2433;--mut:#7a8497;--line:#e8ecf2;--navy:#2b7de9;--btxt:#fff;--acc:#2b7de9;--ok:#2a9150;--bad:#d04545;--side:#2b7de9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:600;font-family:Georgia,serif}.sans,button,input,select,textarea,table,.badge{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#app{min-height:100%}.shell{display:flex;min-height:100vh}
aside{width:244px;background:var(--side);color:#e6f0f8;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:20;transition:transform .2s;display:flex;flex-direction:column}
aside .logo{font-size:17px;padding:0 10px 18px;border-bottom:1px solid #ffffff22;margin-bottom:14px}aside .logo small{display:block;color:#9fd0f0;font:11px system-ui;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
aside a{display:block;padding:10px 12px;border-radius:8px;color:#cfe0ee;cursor:pointer;font:14px system-ui;margin-bottom:3px}aside a.on,aside a:hover{background:#ffffff1a;color:#fff}
aside .me{margin-top:auto;padding:12px 10px;border-top:1px solid #ffffff22;font:13px system-ui}aside .me b{display:block;color:#fff}
main{margin-left:244px;flex:1;padding:28px 32px;min-width:0}
.top{display:none;align-items:center;gap:12px;margin-bottom:16px}.burger{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.head h1{font-size:26px}.sub{color:var(--mut);font:13px system-ui}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.grid .card{margin:0}
.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{font:12px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}tr.row{cursor:pointer}tr.row:hover{background:#2b7de914}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#ffeccc;color:#b86e0a}.badge.approved{background:#d9f5e1;color:#2a9150}.badge.rejected{background:#fde0e0;color:#d04545}.badge.review{background:#dbe9ff;color:#2b6fd6}.badge.draft{background:#eceff4;color:#6b7385}
button{background:var(--navy);color:var(--btxt);border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button.ok{background:var(--ok);color:#fff}button.bad{background:var(--bad);color:#fff}button.sm{padding:4px 10px;font-size:12px}
label{display:block;font:600 13px system-ui;margin:14px 0 5px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}textarea{min-height:110px;resize:vertical}input[type=range]{padding:0;accent-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.auth{max-width:420px;margin:7vh auto;padding:0 16px}.auth .card{padding:28px}.auth h1{font-size:24px;margin-bottom:4px}.tabs{display:flex;gap:6px;margin:18px 0 4px}.tabs button{flex:1}
.err{color:var(--bad);font:13px system-ui;margin-top:10px}.note{background:#2b7de91a;border-left:3px solid var(--acc);padding:10px 14px;border-radius:6px;font:13px system-ui;margin-top:12px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-family:system-ui;margin:16px 0 4px}.sec p{margin:0;white-space:pre-wrap}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;font:14px system-ui;margin:6px 0}.chk input{width:auto}.file{font:13px system-ui;display:flex;gap:10px;align-items:center;margin:4px 0}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin:0;padding:16px}.top{display:flex}.two{grid-template-columns:1fr}}
.pubbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:12px 28px;flex-wrap:wrap}.pubbar b{font:600 17px Georgia,serif;margin-right:auto;cursor:pointer;color:var(--navy)}.pubbar a{padding:8px 12px;border-radius:8px;cursor:pointer;font:14px system-ui}.pubbar a:hover{background:var(--bg)}
.pw{max-width:1100px;margin:0 auto;padding:28px 20px}.hero{background:var(--side);color:#fff;padding:64px 20px}.hero>div{max-width:1100px;margin:0 auto}.hero h1{font-size:clamp(28px,5vw,46px);max-width:780px;line-height:1.15}.hero p{max-width:620px;color:#e3eeff;font:17px/1.6 system-ui;margin:16px 0 26px}.hero .row2{margin:0}.hero button.alt{color:#fff;border-color:#ffffff66}.hero button:not(.alt){background:#fff;color:#2b7de9}
.gc{transition:transform .15s,box-shadow .15s}.gc:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2b7de91f}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.cards .card{margin:0;display:flex;flex-direction:column;gap:8px}.cards .card p{margin:0;color:var(--mut);font:14px system-ui}
.meta{display:flex;justify-content:space-between;gap:8px;font:13px system-ui;color:var(--mut)}.meta b{color:var(--ink)}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:16px}
details{border-bottom:1px solid var(--line);padding:10px 0;font:14px system-ui}summary{cursor:pointer;font-weight:600}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.badge.open{background:#2a915026;color:var(--ok)}.badge.soon{background:#c9831226;color:#9a6208}.badge.closed{background:#8883}
@media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.pubbar{padding:10px 14px}.hero{padding:40px 16px}}
aside{background:var(--card);color:var(--ink);border-right:1px solid var(--line)}aside .logo{border-bottom:1px solid var(--line);color:var(--navy)}aside .logo small{color:var(--mut)}aside a{color:var(--ink)}aside a:hover{background:var(--bg);color:var(--ink)}aside a.on{background:var(--acc);color:#fff}aside .me{border-top:1px solid var(--line)}aside .me b{color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{border-radius:99px;width:auto;min-width:150px}.filters input,.filters select{border-radius:99px}.seg{display:inline-flex;gap:4px}
.flow{display:flex;padding:0;overflow:hidden;cursor:pointer;transition:box-shadow .15s}.flow:hover{box-shadow:0 6px 18px #2b7de91a}.fl{width:250px;padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.ft{flex:1;display:flex;align-items:center;padding:14px 20px;gap:4px}
.fs{flex:1;position:relative;padding-top:22px;font:12px system-ui;color:var(--mut)}.fs span{position:absolute;top:0;left:0}.fs i{display:block;height:2px;background:var(--line);margin-top:8px;position:relative}.fs i::before{content:"";position:absolute;left:0;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.fs.done i{background:var(--ok)}.fs.done i::before{background:var(--ok);border-color:var(--ok)}.fs.now i::before{background:var(--acc);border-color:var(--acc)}.fs.bad i::before{background:var(--bad);border-color:var(--bad)}
.pgn{display:flex;gap:6px;justify-content:center;margin:14px 0}.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl>div{position:relative;margin-bottom:14px;font:13px system-ui}.tl i{position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
@media(max-width:820px){.flow{flex-direction:column}.fl{width:auto;border-right:0;border-bottom:1px solid var(--line)}.ft{padding:12px}.fs{font-size:10px}.pill{flex:1;min-width:120px}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={draft:'Черновик',submitted:'Подана',review:'На рассмотрении',approved:'Одобрена',rejected:'Отклонена'},RN={student:'Кабинет студента',reviewer:'Кабинет эксперта',admin:'Кабинет администратора'},CR=['Оригинальность','Методология','Осуществимость','Значимость'];
const S={users:[],props:[],files:[],ready:false,me:null,route:['home'],tab:'login',err:'',pend:[],nav:false};let db;
const ld=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),money=n=>Number(n||0).toLocaleString('ru-RU')+' ₸',dt=t=>new Date(t).toLocaleDateString('ru-RU');
const uname=id=>(S.users.find(u=>u.id==id)||{name:'Unknown'}).name,badge=s=>`<span class="badge ${s}">${ST[s]}</span>`;
const avg=p=>{const r=Object.values(p.reviews||{});if(!r.length)return null;return r.reduce((a,x)=>a+Object.values(x.scores).reduce((b,c)=>b+c,0)/CR.length,0)/r.length};
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const col=n=>db.collection(n);
function go(...r){S.route=r;S.nav=false;S.err='';S.pend=[];render();scrollTo(0,0)}
function typing(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('main')}
function render(force){if(!force&&typing())return;const a=$('#app');if(!S.ready){a.innerHTML='<p class="sub" style="padding:40px;text-align:center">Загрузка…</p>';return}
if(!S.me){a.innerHTML=S.route[0]=='auth'?authV():pubV();return}
if(!S.role){a.innerHTML=roleV();return}
const R=S.role,nav={student:[['home','Главная'],['grants','Каталог грантов'],['saved','Сохранённые'],['list','Мои заявки'],['new','Новая заявка']],reviewer:[['home','Главная'],['grants','Каталог грантов'],['list','Назначенные заявки']],admin:[['home','Главная'],['grants','Каталог грантов'],['list','Все заявки'],['agrants','Управление грантами'],['users','Пользователи']]}[R];
const r=S.route[0],act=r=='view'?'list':r=='grant'?'grants':r=='agedit'?'agrants':r;let body;
try{body={home:home,list:list,new:form,view:view,users:users,grants:grants,grant:grant,saved:saved,agrants:agrants,agedit:agedit}[r]()}catch(e){body='<div class="card">Something went wrong.</div>'}
a.innerHTML=`<div class="shell"><aside class="${S.nav?'open':''}"><div class="logo">Грантовая система<small>${RN[R]}</small></div>${nav.map(n=>`<a class="${act==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<div class="me"><b>${esc(S.me.name)}</b>${esc(S.me.email)}<br><a style="padding:8px 0 0;margin:6px 0 0;color:var(--acc)" onclick="pickRole(null)">Сменить роль</a><a style="padding:4px 0;margin:0;color:var(--acc)" onclick="logout()">Выйти</a></div></aside>
<main><div class="top"><button class="burger" onclick="S.nav=!S.nav;render(1)">☰</button><b>Грантовая система</b></div>${body}</main></div>`}
function authV(){const L=S.tab=='login';return`<div class="auth"><div class="card"><h1>Грантовая система</h1><div class="sub">Подача и экспертиза заявок на гранты</div><a class="sub" style="cursor:pointer" onclick="go('home')">← На главную</a>
<div class="tabs"><button class="${L?'':'alt'}" onclick="S.tab='login';S.err='';render(1)">Вход</button><button class="${L?'alt':''}" onclick="S.tab='reg';S.err='';render(1)">Регистрация</button></div>
${window.claude?'<button type="button" style="width:100%;margin-top:14px" onclick="emailLogin()">✉️ Войти через мой Gmail / почту</button><div class="sub" style="text-align:center;margin:12px 0 0">или по email и паролю</div>':''}<form onsubmit="return auth(event)">${L?'':'<label>Полное имя</label><input name="name" required>'}<label>Электронная почта</label><input name="email" type="email" required><label>Пароль</label><input name="pw" type="password" minlength="6" required>
<div class="err">${esc(S.err)}</div><div class="row2"><button style="width:100%">${L?'Войти':'Создать аккаунт'}</button></div></form>
${!L&&!S.users.length?'<div class="note">Пока нет ни одного аккаунта — первый созданный аккаунт станет администратором.</div>':''}</div></div>`}
async function auth(e){e.preventDefault();const f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),pw=f.get('pw');
if(S.tab=='login'){const u=S.users.find(x=>x.email==email);if(!u||!u.hash||await hash(pw,u.salt)!=u.hash){S.err='Неверная почта или пароль.';return render(1),false}S.me=u;S.role=null;sv('role',null);sv('uid',u.id)}
else{if(S.users.find(x=>x.email==email)){S.err='Эта почта уже зарегистрирована.';return render(1),false}const salt=uid('s'),u={id:uid('u'),name:f.get('name').trim(),email,salt,hash:await hash(pw,salt),isAdmin:!S.users.length,created:Date.now()};await col('users').doc(u.id).set(u);S.users.push(u);S.me=u;S.role=null;sv('role',null);sv('uid',u.id)}
S.route=['home'];render(1);return false}
const canAdmin=u=>!!u&&(u.isAdmin||u.role=='admin');
async function emailLogin(){try{const cu=window.claude&&claude.use?await claude.use('user'):null;const m=cu?await cu.me():{};let email=(m.email||'').toLowerCase();const cid=m.id||'';let u=S.users.find(x=>(cid&&x.cid==cid)||(email&&x.email==email));if(!u&&!email){email=(prompt('Введите вашу почту (Gmail или другую) для создания аккаунта:')||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))throw 0;u=S.users.find(x=>x.email==email)}
if(u&&u.hash&&u.cid!=cid&&!(m.email&&m.email.toLowerCase()==u.email)){S.err='На эту почту уже есть аккаунт с паролем. Войдите по паролю.';return render(1)}
if(!u){u={id:uid('u'),name:m.name||email.split('@')[0],email,cid,verified:!!m.email,isAdmin:!!m.isOwner||!S.users.length,created:Date.now()};await col('users').doc(u.id).set(u)}
else if(!u.cid&&cid&&!u.hash){u.cid=cid;await col('users').doc(u.id).update({cid})}
else if(m.isOwner&&!canAdmin(u)){u.isAdmin=true;await col('users').doc(u.id).update({isAdmin:true})}
S.me=u;S.role=null;sv('role',null);sv('uid',u.id);S.err='';render(1)}catch(e){S.err='Не удалось определить аккаунт. Войдите в Claude или используйте email и пароль.';render(1)}}
function roleV(){const c=[['student','🎓','Студент','Подавайте заявки на гранты и следите за их статусом'],['reviewer','📝','Эксперт','Оценивайте назначенные заявки и отправляйте рецензии']];if(canAdmin(S.me))c.push(['admin','🛡️','Администратор','Управляйте пользователями, назначайте экспертов, принимайте решения']);
return`<div class="auth" style="max-width:520px"><div class="card"><h1>Добро пожаловать, ${esc(S.me.name)}</h1><div class="sub">Выберите, в какой роли продолжить. Роль можно сменить в любой момент.</div>${c.map(x=>`<div class="card" style="cursor:pointer;margin:12px 0 0;display:flex;gap:14px;align-items:center" onclick="pickRole('${x[0]}')"><span style="font-size:28px">${x[1]}</span><div><b>${x[2]}</b><div class="sub">${x[3]}</div></div></div>`).join('')}${canAdmin(S.me)?'':'<div class="note">Доступ администратора выдаёт действующий администратор.</div>'}<div class="row2"><button class="alt" onclick="logout()">Выйти</button></div></div></div>`}
function pickRole(r){S.role=r;sv('role',r);S.route=['home'];render(1)}
function logout(){S.me=null;S.role=null;sv('role',null);sv('uid',null);S.route=['home'];render(1)}
const mine=()=>S.props.filter(p=>S.role=='admin'||(S.role=='student'&&p.sid==S.me.id)||(S.role=='reviewer'&&(p.reviewers||[]).includes(S.me.id)&&p.status!='draft'));
function rows(ps,showS){return`<div class="tw"><table><tr><th>Название</th>${showS?'<th>Заявитель</th>':''}<th>Бюджет</th><th>Статус</th><th>Балл</th><th>Обновлено</th></tr>${ps.map(p=>`<tr class="row" onclick="go('view','${p.id}')"><td><b>${esc(p.title)}</b></td>${showS?`<td>${esc(uname(p.sid))}</td>`:''}<td>${money(p.budget)}</td><td>${badge(p.status)}</td><td>${avg(p)?avg(p).toFixed(1)+'/10':'—'}</td><td>${dt(p.updated)}</td></tr>`).join('')||'<tr><td colspan=6 class="sub">Пока ничего нет.</td></tr>'}</table></div>`}
function home(){const R=S.role,ps=mine(),c=s=>ps.filter(p=>p.status==s).length,hd=t=>`<div class="head"><div><h1>${t}</h1><div class="sub">С возвращением, ${esc(S.me.name)}</div></div></div>`;
if(R=='student')return hd('Мой кабинет')+`<div class="grid">${[['Заявки',ps.length],['На рассмотрении',c('review')+c('submitted')],['Одобрено',c('approved')],['Черновики',c('draft')]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="card"><div class="head" style="margin:0 0 8px"><h3>Последние заявки</h3><button class="sm" onclick="go('new')">+ Новая заявка</button></div>${rows(ps.slice(0,6))}</div>`;
if(R=='reviewer'){const todo=ps.filter(p=>!(p.reviews||{})[S.me.id]);return hd('Кабинет эксперта')+`<div class="grid"><div class="card stat"><b>${ps.length}</b><span>Назначено</span></div><div class="card stat"><b>${todo.length}</b><span>Ждут моей оценки</span></div><div class="card stat"><b>${ps.length-todo.length}</b><span>Рецензий отправлено</span></div></div><div class="card"><h3>Назначенные заявки</h3>${rows(ps,1)}</div>`}
const sub=S.props.filter(p=>p.status!='draft'),mx=Math.max(1,...Object.keys(ST).map(s=>S.props.filter(p=>p.status==s).length)),ap=S.props.filter(p=>p.status=='approved'),bars=Object.keys(ST).map((s,i)=>{const n=S.props.filter(p=>p.status==s).length,h=n/mx*130;return`<g><rect x="${28+i*74}" y="${160-h}" width="48" height="${h}" rx="5" fill="${['#9aa7b4','#f0a93b','#2b7de9','#2a9150','#d04545'][i]}"/><text x="${52+i*74}" y="${154-h}" text-anchor="middle" font-size="13" fill="currentColor">${n}</text><text x="${52+i*74}" y="180" text-anchor="middle" font-size="10" fill="currentColor">${ST[s]}</text></g>`}).join('');
const sc=S.props.map(avg).filter(x=>x!=null);
return hd('Обзор системы')+`<div class="grid">${[['Всего заявок',S.props.length],['Требуют решения',S.props.filter(p=>['submitted','review'].includes(p.status)).length],['Запрошено средств',money(sub.reduce((a,p)=>a+ +p.budget,0))],['Одобрено средств',money(ap.reduce((a,p)=>a+ +p.budget,0))],['Средний балл',sc.length?(sc.reduce((a,b)=>a+b)/sc.length).toFixed(1):'—'],['Пользователи',S.users.length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>

return`<div class="head"><div><h1>${R=='admin'?'Все заявки':R=='reviewer'?'Назначенные заявки':'Мои заявки'}</h1></div><div class="tools"><input class="pill" placeholder="Поиск заявок…" aria-label="Поиск" value="${esc(S.lq||'')}" oninput="S.lq=this.value;S.pg=1;$('#lt').innerHTML=lbody()"><select class="pill" aria-label="Статус" onchange="S.filter=this.value;S.pg=1;render(1)"><option value="">Все статусы</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${fl==k?'selected':''}>${v}</option>`).join('')}</select><span class="seg"><button class="${fw?'':'alt'} sm" onclick="S.lv='flow';render(1)">Карточки</button><button class="${fw?'alt':''} sm" onclick="S.lv='table';render(1)">Таблица</button></span>${R=='student'?`<button onclick="go('new')">+ Новая</button>`:''}</div></div><div id="lt">${lbody()}</div>`}
function chart(){const now=new Date(),m=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);m.push({l:d.toLocaleDateString('ru-RU',{month:'short'}),y:d.getFullYear(),mo:d.getMonth(),n:0})}S.props.filter(p=>p.status!='draft').forEach(p=>{const d=new Date(p.created),x=m.find(k=>k.y==d.getFullYear()&&k.mo==d.getMonth());if(x)x.n++});const mx=Math.max(1,...m.map(k=>k.n)),pt=m.map((k,i)=>[30+i*60,120-k.n/mx*85]),L=pt.map(p=>p.join(',')).join(' L');
return`<svg viewBox="0 0 360 150" style="width:100%"><path d="M${L} L330,120 L30,120Z" fill="#2b7de922"/><path d="M${L}" fill="none" stroke="#2b7de9" stroke-width="2.5"/>${pt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2b7de9"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" fill="currentColor">${m[i].n}</text><text x="${p[0]}" y="140" text-anchor="middle" font-size="11" fill="currentColor">${m[i].l}</text>`).join('')}</svg>`}
function activity(){const ev=[];S.props.forEach(p=>{if(p.status!='draft')ev.push([p.created,`Заявка «${p.title}» подана · ${uname(p.sid)}`]);Object.entries(p.reviews||{}).forEach(([u,r])=>ev.push([r.at,`${uname(u)} оценил(а) «${p.title}»`]));if(p.decision)ev.push([p.decision.at,`«${p.title}»: ${ST[p.status].toLowerCase()}`])});ev.sort((a,b)=>b[0]-a[0]);
return ev.length?`<div class="tl">${ev.slice(0,6).map(e=>`<div><i></i><div class="sub">${dt(e[0])}</div>${esc(e[1])}</div>`).join('')}</div>`:'<p class="sub">Событий пока нет.</p>'}
function landing(){const op=G.filter(g=>gs(g)!='closed').sort((a,b)=>new Date(a.d)-new Date(b.d)).slice(0,3),st=[[G.length,'грантов в каталоге'],[S.props.filter(p=>p.status!='draft').length,'поданных проектов'],[S.users.length,'участников'],[new Set(G.map(g=>g.o)).size,'организаций']];
return`<div class="hero"><div><h1>Гранты на исследования — от идеи до решения в одном месте</h1><p>Находите конкурсы, подавайте заявки онлайн и отслеживайте статус рассмотрения. Платформа объединяет студентов, экспертов и администраторов.</p><div class="row2"><button onclick="go('grants')">Найти грант</button><button class="alt" onclick="applyG('')">Подать заявку</button><button class="alt" onclick="$('#how').scrollIntoView({behavior:'smooth'})">Подробнее</button></div></div></div>
<div class="pw"><div class="grid">${st.map(x=>`<div class="card stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="head"><h2>Актуальные конкурсы</h2><a class="sub" style="cursor:pointer" onclick="go('grants')">Все гранты →</a></div><div class="cards">${op.map(gcard).join('')||'<div class="card sub">Актуальных конкурсов пока нет.</div>'}</div>
<h2 id="how" style="margin:34px 0 14px">Как это работает</h2><div class="grid">${[['1. Выберите грант','Найдите конкурс по теме, сумме и сроку.'],['2. Подайте заявку','Заполните форму и приложите документы.'],['3. Следите за статусом','Эксперты оценивают, администратор принимает решение.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sub">${x[1]}</p></div>`).join('')}</div>
</div>`}
function pubV(){const r=S.route[0],pg={home:landing,grants:grants,grant:grant}[r]||landing;let b;try{b=pg()}catch(e){b='<div class="card">Ошибка загрузки страницы.</div>'}
return`<div class="pubbar"><b onclick="go('home')">🎓 Грантовая система</b><a onclick="go('home')">Главная</a><a onclick="go('grants')">Гранты</a><a onclick="S.tab='login';go('auth')">Войти</a><button class="sm" onclick="S.tab='reg';go('auth')">Регистрация</button></div>${r=='home'?b:`<div class="pw">${b}</div>`}<div class="pw sub" style="text-align:center">Данные каталога демонстрационные. Для реальных конкурсов нужна серверная часть.</div>`}
function localDb(){const K='grants_',mem={},ls={};const rd=n=>{try{return JSON.parse(localStorage.getItem(K+n)||'{}')}catch(e){return mem[n]||{}}},wr=(n,o)=>{mem[n]=o;try{localStorage.setItem(K+n,JSON.stringify(o))}catch(e){}};
const snap=n=>({docs:Object.entries(rd(n)).map(([id,d])=>({id,data:()=>d}))}),emit=n=>(ls[n]||[]).forEach(f=>f(snap(n)));
return{collection:n=>({doc:id=>({set:async d=>{const o=rd(n);o[id]=d;wr(n,o);emit(n)},update:async d=>{const o=rd(n);o[id]={...(o[id]||{}),...d};wr(n,o);emit(n)},delete:async()=>{const o=rd(n);delete o[id];wr(n,o);emit(n)}}),onSnapshot:f=>{(ls[n]=ls[n]||[]).push(f);setTimeout(()=>f(snap(n)),0)}})}}
(async()=>{db=(window.claude&&claude.use&&await claude.use('db'))||localDb();if(!db){$('#app').innerHTML='<p style="padding:40px;text-align:center" class="sans">База данных недоступна. Откройте страницу, войдя в Claude.</p>';return}
const t=setTimeout(()=>{if(!S.ready){S.ready=true;render(1)}},10000);let n=0;
const sub=(k,key)=>col(k).onSnapshot(sn=>{S[key]=sn.docs.map(d=>({id:d.id,...d.data()}));if(key=='grants')G=S.grants;if(key=='users'){const id=ld('uid');S.me=id?S.users.find(u=>u.id==id)||null:null;const r=ld('role');if(S.me&&!S.role&&['student','reviewer','admin'].includes(r)&&(r!='admin'||canAdmin(S.me)))S.role=r;if(!S.me||(S.role=='admin'&&!canAdmin(S.me)))S.role=null}if(!S.ready&&++n>=4){S.ready=true;clearTimeout(t)}render()},()=>{});
sub('users','users');sub('proposals','props');sub('files','files');sub('grants','grants')})();
</script></body></html>
